version: '3.8'

services:
  mysql:
    image: "mysql:8.0"
    container_name: "guaranin-mysql"
    restart: "no"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "guaranin"
    volumes:
      - "guaranin_mysql_data:/var/lib/mysql"

  phpmyadmin:
    image: "phpmyadmin:latest"
    container_name: "guaranin-phpmyadmin"
    restart: "no"
    depends_on:
      - mysql
    ports:
      - "8081:80"
    environment:
      PMA_HOST: "mysql"
      PMA_PORT: "3306"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass MinhaSenha123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      TZ: America/Sao_Paulo
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "MinhaSenha123", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # docker exec -it redis redis-cli -a MinhaSenha123
  
volumes:
  guaranin_mysql_data:
  redis_data:
