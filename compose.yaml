version: '3.8'

services:
  mysql:
    image: "mysql:8.0"
    container_name: "guaranin-mysql"
    restart: "no"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "guaranin"
    volumes:
      - "guaranin_mysql_data:/var/lib/mysql"

  phpmyadmin:
    image: "phpmyadmin:latest"
    container_name: "guaranin-phpmyadmin"
    restart: "no"
    depends_on:
      - mysql
    ports:
      - "8081:80"
    environment:
      PMA_HOST: "mysql"
      PMA_PORT: "3306"

volumes:
  guaranin_mysql_data: