version: '3.8'

services:
  mysql:
    image: "mysql:8.0"
    container_name: "guaranin-mysql"
    restart: "no"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "@MysSql!"
      MYSQL_DATABASE: "guaranin"
      MYSQL_USER: "teste"
      MYSQL_PASSWORD: "123456789"
    volumes:
      - "locodora_mysql_data:/var/lib/mysql"

volumes:
  locodora_mysql_data:
