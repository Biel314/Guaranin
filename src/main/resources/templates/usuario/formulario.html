<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/head :: head('Manter Usuário')}"></head>

<body>

<header th:replace="~{fragmentos/header :: header(activePage='usuario')}"></header>

<div class="box">

    <h1 th:text="${usuario != null ? 'Editar Usuário' : 'Cadastro Usuário'}">
        Cadastro Usuário
    </h1>

    <form method="post" action="/usuario">
        <input type="hidden"
               name="_method"
               value="put"
               th:if="${usuario != null}">

        <input type="hidden"
               name="id"
               th:value="${usuario?.id}">

        <div class="form-group">

            <label for="login">
                E-mail:
            </label>

            <input type="email"
                   id="login"
                   name="login"
                   th:value="${usuario?.login}"
                   maxlength="255"
                   placeholder="Digite o e-mail"
                   required>

        </div>

        <div class="form-group">

            <label for="password">
                Senha:
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   minlength="8"
                   maxlength="72"
                   placeholder="Digite a senha"
                   required>

            <small>
                A senha deve possuir entre 8 e 72 caracteres,
                contendo pelo menos uma letra maiúscula,
                uma letra minúscula, um número e um caractere especial.
            </small>

        </div>

        <div class="form-group"
             style="margin-top: 20px;">

            <label for="mascoteId">
                Mascote:
            </label>

            <select id="mascoteId"
                    name="mascoteId">

                <option value="">
                    - Selecione um mascote -
                </option>

                <option th:each="mascote : ${mascotes}"
                        th:value="${mascote.id}"
                        th:text="${mascote.nome}"
                        th:selected="${usuario?.mascote?.id == mascote.id}">
                </option>

            </select>

        </div>

        <div style="margin-top: 20px;">

            <input type="submit"
                   value="Cadastrar"
                   th:value="${usuario != null ? 'Atualizar' : 'Cadastrar'}">

            <a href="/usuario">
                Voltar
            </a>

        </div>

    </form>

</div>

</body>
</html>
