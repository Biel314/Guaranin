<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manter Usuário</title>
</head>

<body>

<div class="box">

    <h1 th:text="${usuario != null ? 'Editar Usuário' : 'Cadastro Usuário'}">
        Cadastro Usuário
    </h1>

    <form method="post" action="/usuario">
        <input type="hidden"
               name="_method"
               value="put"
               th:if="${usuario != null}">

        <input type="hidden"
               name="id"
               th:value="${usuario?.id}">

        <div class="form-group">
            <label for="apelido">Apelido:</label>
            <input type="text"
                   id="apelido"
                   name="apelido"
                   th:value="${usuario?.apelido}"
                   maxlength="26"
                   placeholder="Digite o apelido"
                   required>
        </div>

        <div class="form-group">

            <label for="email">
                E-mail:
            </label>

            <input type="email"
                   id="email"
                   name="email"
                   th:value="${usuario?.email}"
                   maxlength="254"
                   placeholder="Digite o e-mail"
                   required>

        </div>

        <div class="form-group">

            <label for="password">
                Senha:
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   minlength="8"
                   maxlength="72"
                   placeholder="Digite a senha"
                   required>

            <small>
                A senha deve possuir entre 8 e 72 caracteres,
                contendo pelo menos uma letra maiúscula,
                uma letra minúscula, um número e um caractere especial.
            </small>

        </div>

        <div style="margin-top: 20px;">

            <input type="submit"
                   value="Cadastrar"
                   th:value="${usuario != null ? 'Atualizar' : 'Cadastrar'}">

            <a href="/usuario">
                Voltar
            </a>

        </div>

    </form>

</div>

</body>
</html>
