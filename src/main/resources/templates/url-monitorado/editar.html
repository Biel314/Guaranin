<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar URL Monitorada</title>
</head>

<body>

<div class="box">

    <h1>Editar URL Monitorada</h1>

    <div th:if="${errors != null}" style="background-color: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border: 1px solid #f5c6cb; border-radius: 4px;">
        <ul>
            <li th:each="err : ${errors}" th:text="${err.defaultMessage}">Erro</li>
        </ul>
    </div>

    <form th:action="@{/url-monitorado}" method="post" th:object="${urlMonitoradaUpdateDTO}">
        <input type="hidden" name="_method" value="put">
        <input type="hidden" name="id" th:value="*{id}">

        <div class="form-group">
            <label for="link">Link:</label>
            <input type="text"
                   id="link"
                   th:field="*{link}"
                   placeholder="https://exemplo.com"
                   required>
            <p th:if="${#fields.hasErrors('link')}" th:errors="*{link}" style="color: red; font-size: 0.85em; margin-top: 4px;"></p>
        </div>

        <div class="form-group">
            <label for="ip">IP (opcional):</label>
            <input type="text"
                   id="ip"
                   th:field="*{ip}"
                   maxlength="50"
                   placeholder="127.0.0.1">
            <p th:if="${#fields.hasErrors('ip')}" th:errors="*{ip}" style="color: red; font-size: 0.85em; margin-top: 4px;"></p>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" th:field="*{padrao}"> URL Padrão
            </label>
        </div>

        <div style="margin-top: 20px;">
            <input type="submit" value="Atualizar">
            <a th:href="@{/url-monitorado}">Voltar</a>
        </div>

    </form>

</div>

</body>
</html>
