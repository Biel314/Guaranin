<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mascotes</title>
</head>

<body>

<div class="box">
    <h1>Mascotes</h1>

    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Nivel</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="mascote : ${mascotes}">
            <td th:text="${mascote.nome}">https://example.com</td>
            <td th:text="${mascote.nivel}">127.0.0.1</td>
            <td th:text="${mascote.estado}">estado</td>
            <td>
                <button type="submit">
                    <a th:href="@{/mascote/editar/{id}(id=${mascote.id})}">Editar</a>
                </button>
                <button type="submit">
                    <a th:href="@{/mascote/visualizar/{id}(id=${mascote.id})}">Visualizar Informações</a>
                </button>
           </td>
        </tr>
        </tbody>
    </table>
</div>
<div class="bottom">
   <button type="submit">
       <a href="/usuario">Voltar para o Usuario</a>
   </button>
</div>

</body>
</html>
